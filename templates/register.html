{% extends 'base.html' %}
{% block title %}注册 - 大连理工大学跳蚤市场{% endblock %}
{% block content %}
<section class="auth-layout">
  <article class="auth-panel">
    <p class="eyebrow">New Account</p>
    <h2>注册普通用户</h2>
    <form method="post" class="form-stack" autocomplete="off">
      <label>账号<input name="user_id" placeholder="例如 u100" autocomplete="username" required></label>
      <label>昵称<input name="user_name" placeholder="你的昵称" autocomplete="off" required></label>
      <label>手机号<input name="phone" placeholder="用于交易联系" autocomplete="tel" required></label>
      <label>密码<input type="password" name="password" autocomplete="new-password" required></label>
      <button class="button" type="submit">完成注册</button>
    </form>
    <a class="text-link" href="{{ url_for('login') }}">已有账号，去登录</a>
  </article>
</section>
{% endblock %}
